<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../board/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strips">
<meta name="theme-color" content="#111110">
<meta name="robots" content="noindex,nofollow">
<title>ELISE &middot; Progress strips</title>
<link rel="stylesheet" href="../board/fonts.css">
<link rel="stylesheet" href="../test.css">
<style>
main{padding:12px var(--gut-r) 30px var(--gut-l)}
.rack{font-family:var(--f-cond);font-size:10.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line-hard);
  padding:0 0 4px;margin:17px 0 0;display:flex;align-items:baseline;gap:8px}
.rack:first-child{margin-top:0}
.rack b{margin-left:auto;font-family:var(--f-num);font-size:10px;font-weight:400}

/* a strip: fixed boxes in a fixed order, so your eye lands in the same place */
.wrapst{position:relative;display:flex;align-items:stretch;gap:0;margin-top:7px}
.flag{flex:0 0 17px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-cond);font-size:9px;font-weight:700;letter-spacing:.06em;
  color:var(--warn);background:transparent;border:0;cursor:pointer;padding:0;
  writing-mode:vertical-rl;line-height:1}
.flag.spacer{cursor:default;color:transparent}
.strip{flex:1;min-width:0;display:grid;grid-template-columns:48px 40px 1fr 62px;
  background:var(--surface);border:1px solid var(--line-hard);border-left-width:6px;
  font-family:var(--f-num);font-size:11.5px;text-align:left;cursor:pointer;padding:0;
  color:inherit;align-items:stretch}
.strip > span{padding:7px 6px;border-right:1px solid var(--line);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center}
.strip .qt{border-right:0;text-align:right;font-size:11px}
.strip .co{font-weight:700}
.strip .tm{font-weight:600}
.strip .ds{font-family:var(--f-ui);font-size:12px;white-space:normal;line-height:1.25}
/* cocked, the ATC way: a strip pulled out of line needs attention. Here that
   is anything still only requested. Tap the flag to confirm it. */
.strip.cock{border-style:dashed;border-left-style:solid}
.strip.done{opacity:.44}
.strip.live{border-color:var(--clock);box-shadow:0 0 0 1px var(--clock)}
.strip.sb{box-shadow:inset 0 0 0 1px var(--warn)}
.strip > span.ann{grid-column:1/-1;border-top:1px dotted var(--line);border-right:0;
  padding:5px 7px;font-family:var(--f-ui);font-size:11px;line-height:1.35;
  color:var(--ink-2);white-space:normal;text-align:left}
.strip > span.pairline{grid-column:1/-1;border-top:1px dotted var(--line);border-right:0;
  padding:4px 7px;font-size:10px;color:var(--ink-3);white-space:normal;text-align:left}
.brkstrip{display:flex;align-items:center;gap:8px;margin-top:7px;padding:6px 8px;
  border:1px dashed var(--line-hard);border-radius:3px;font-family:var(--f-cond);
  font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;
  color:var(--ink-3);
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.empty{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);padding:9px 2px}
.key{display:flex;gap:14px;flex-wrap:wrap;padding-top:8px;font-size:11px;color:var(--ink-3)}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:16px 0 30px;border-top:1px solid var(--line);
  margin-top:18px}
.nav a{font-family:var(--f-cond);font-size:11px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);
  border-radius:4px;padding:7px 11px}
.nav a.on{border-color:var(--ink);color:var(--ink)}
</style>
</head>
<body>

<header>
  <div class="top">
    <span class="wm">Elise</span>
    <span class="clk" id="clk">--:--</span>
    <span class="badge" id="sbadge">Sandbox</span>
    <a class="back" href="../board/">Board</a>
  </div>
  <div class="datebar">
    <button type="button" id="prev" aria-label="Previous day">&lsaquo;</button>
    <span class="dlab" id="dlab">&nbsp;<small>&nbsp;</small></span>
    <button type="button" class="act undo" id="sreset" hidden>Undo all</button>
    <button type="button" class="act go" id="sadd">+ Add</button>
    <button type="button" id="next" aria-label="Next day">&rsaquo;</button>
  </div>
</header>

<main id="racks"><div class="empty">Loading&hellip;</div></main>
<div class="gut" style="padding-left:var(--gut-l);padding-right:var(--gut-r)">
  <nav class="nav">
    <a href="../today/">Today</a>
    <a href="../rows/">Rows</a>
    <a href="../cal/">Day view</a>
    <a href="../strips/" class="on">Strips</a>
    <a href="../board/">Real board</a>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Booking"></div>

<script src="../board/config.js"></script>
<script src="../sandbox.js"></script>
<script src="../testkit.js"></script>
<script>
"use strict";
var S = TK.state, hm = TK.hm, esc = TK.esc;
var INDEX = [];

function stripHtml(r, i, cls){
  var tr = TK.trade(r.co), c = tr[1];
  var qty = r.qty ? r.qty + (r.qty === 1 ? " lift" : " lifts")
                  : (r.kg ? (r.kg/1000).toFixed(1) + "t" : (r.type === "del" ? "truck" : "—"));
  var cock = r.status !== "con";
  var ann = "";
  if(r.notes){
    /* the first sentence is the hand annotation on a paper strip */
    var n0 = String(r.notes), dot = n0.indexOf(". ");
    var first = dot > 0 ? n0.slice(0, dot + 1) : n0;
    if(first.length > 150) first = first.slice(0, 147) + "…";
    ann = '<span class="ann">' + esc(first) + '</span>';
  }
  var pairTxt = "";
  if(r.pair){
    var p = S.rows.filter(function(x){ return x.id === r.pair; })[0];
    pairTxt = '<span class="pairline">⚭ pairs with ' +
      (p ? esc(p.co) + " " + hm(p.start_min) + " · " +
           (p.type === "del" ? "the truck" : "the crane slot") : esc(r.pair)) + '</span>';
  }
  return '<div class="wrapst">' +
    (cock ? '<button class="flag" type="button" data-con="' + i +
            '" title="Confirm this one">REQ</button>'
          : '<span class="flag spacer"> </span>') +
    '<button class="strip ' + cls + (cock ? " cock" : "") +
      (r.__added || r.__edited ? " sb" : "") +
      '" data-i="' + i + '" style="border-left-color:' + c + '">' +
    '<span class="tm">' + hm(r.start_min) + '</span>' +
    '<span class="co" style="color:' + c + '">' + esc(r.co) + '</span>' +
    '<span class="ds">' + esc(r.descr || "") + '</span>' +
    '<span class="qt">' + esc(qty) + '</span>' +
    ann + pairTxt + '</button></div>';
}

function render(){
  var m = document.getElementById("racks");
  if(S.err){ m.innerHTML = '<div class="empty">' + esc(S.err) + '</div>'; return; }

  var hdr = S.note ? '<div class="empty">' + esc(S.note) + '</div>' : '';
  if(!S.rows.length){
    m.innerHTML = hdr + '<div class="empty">Nothing booked for this day. ' +
      'Use + Add to try one.</div>'; return;
  }

  INDEX = S.rows.slice();
  var today = S.date === TK.iso(new Date()), nm = TK.nowMin();
  var h = hdr;

  function rack(title, set, cls, note){
    h += '<div class="rack">' + title + (note ? ' <span>' + note + '</span>' : '') +
         '<b>' + set.length + '</b></div>';
    if(!set.length){ h += '<div class="empty">—</div>'; return; }
    set.forEach(function(r){ h += stripHtml(r, INDEX.indexOf(r), cls); });
  }

  if(today){
    rack("Active", S.rows.filter(function(r){
      return nm >= r.start_min && nm < r.start_min + (r.dur||10); }), "live");
    rack("Pending", S.rows.filter(function(r){ return r.start_min > nm; }), "");
    rack("Cleared", S.rows.filter(function(r){
      return r.start_min + (r.dur||10) <= nm; }), "done");
  } else {
    rack("All movements", S.rows, "", hm(S.rows[0].start_min) + " onwards");
  }

  h += '<div class="rack">Crane breaks<b>' + S.breaks.length + '</b></div>';
  S.breaks.forEach(function(b){
    h += '<div class="brkstrip"><span>' + hm(b[0]) + " – " + hm(b[0]+b[1]) +
         '</span><span style="margin-left:auto">no lift runs through</span></div>';
  });

  var lifts = S.rows.filter(function(r){ return r.type !== "del"; }).length;
  var con   = S.rows.filter(function(r){ return r.status === "con"; }).length;
  h += '<div class="foot">' + lifts + " on the hook · " +
       (S.rows.length - lifts) + " deliveries · " + con + " of " +
       S.rows.length + ' confirmed</div>' +
       '<div class="key"><span>Flush = confirmed</span>' +
       '<span>Cocked out = requested</span></div>' +
       '<div class="hint">Tap <b>REQ</b> down the side to confirm a strip. ' +
       'Tap the strip itself to change it, <b>+ Add</b> for a new one. ' +
       'Everything stays on this phone &mdash; the real board is never written to.</div>';
  m.innerHTML = h;
}

document.getElementById("racks").addEventListener("click", function(e){
  var f = e.target.closest(".flag[data-con]");
  if(f){
    var rf = INDEX[+f.getAttribute("data-con")];
    if(rf) SB.edit(S.date, rf, {status: "con"});
    TK.refresh();
    return;
  }
  var b = e.target.closest(".strip");
  if(!b) return;
  var r = INDEX[+b.getAttribute("data-i")];
  if(r) TK.openSheet(r, false);
});

TK.boot(render);
</script>
</body></html>
