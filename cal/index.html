<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../board/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Day view">
<meta name="theme-color" content="#111110">
<meta name="robots" content="noindex,nofollow">
<title>ELISE &middot; Day view</title>
<link rel="stylesheet" href="../board/fonts.css">
<link rel="stylesheet" href="../test.css">
<style>
:root{--pxh:82px}                        /* one hour */
.hdrow{display:grid;grid-template-columns:42px 1fr 1fr;border-top:1px solid var(--line)}
.hdrow span{font-family:var(--f-cond);font-size:10px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);padding:6px 0 6px 7px;
  border-left:1px solid var(--line)}
.hdrow span:first-child{border-left:0}
main{padding:9px var(--gut-r) 30px var(--gut-l)}
.grid{display:grid;grid-template-columns:42px 1fr 1fr;position:relative}
.times{position:relative}
.times b{position:absolute;right:7px;font-family:var(--f-num);font-size:10px;font-weight:400;
  color:var(--ink-3);transform:translateY(-5px)}
.col{position:relative;border-left:1px solid var(--line)}
.rule{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.rule.half{opacity:.45;border-top-style:dotted}
.brk{position:absolute;left:0;right:0;
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.ev{position:absolute;border-radius:4px;padding:3px 6px;overflow:hidden;font-size:11.5px;
  line-height:1.22;border:1px solid transparent;display:block;text-align:left;
  font-family:inherit;cursor:grab}
.ev b{font-family:var(--f-cond);font-weight:700;letter-spacing:.06em}
.ev .q{font-family:var(--f-num);font-size:9.5px;opacity:.82}
.ev.req{border-style:dashed}
.ev.one{white-space:nowrap;text-overflow:ellipsis}
.ev.tiny{padding:0 5px;font-size:9.5px;line-height:15px}
.ev.sb::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;
  border-radius:50%;background:currentColor;opacity:.9}
.ev.drag{cursor:grabbing;z-index:9;box-shadow:0 7px 20px rgba(0,0,0,.45);opacity:.96;
  outline:2px solid var(--paper);transform:scale(1.015)}
.nowline{position:absolute;left:42px;right:0;border-top:2px solid var(--alarm);z-index:6;
  pointer-events:none}
.nowline i{position:absolute;left:-5px;top:-5px;width:9px;height:9px;border-radius:50%;
  background:var(--alarm)}
.nowtag{position:absolute;left:0;width:42px;text-align:right;padding-right:7px;
  font-family:var(--f-num);font-size:9.5px;color:var(--alarm);transform:translateY(-6px);
  z-index:6;pointer-events:none;background:var(--paper)}
.ghost{position:fixed;z-index:60;pointer-events:none;font-family:var(--f-num);font-size:13px;
  font-weight:700;background:var(--ink);color:var(--paper);border-radius:5px;padding:5px 9px;
  display:none}
.ghost.on{display:block}
.legend{display:flex;gap:11px;flex-wrap:wrap;padding:11px 0 0;font-size:11px;color:var(--ink-3)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
</style>
</head>
<body>

<header>
  <div class="top">
    <span class="wm">Elise</span>
    <span class="clk" id="clk">--:--</span>
    <span class="badge" id="sbadge">Sandbox</span>
    <a class="back" href="../board/">Board</a>
  </div>
  <div class="datebar">
    <button type="button" id="prev" aria-label="Previous day">&lsaquo;</button>
    <span class="dlab" id="dlab">&nbsp;<small>&nbsp;</small></span>
    <button type="button" class="act undo" id="sreset" hidden>Undo all</button>
    <button type="button" class="act go" id="sadd">+ Add</button>
    <button type="button" id="next" aria-label="Next day">&rsaquo;</button>
  </div>
  <div class="hdrow"><span></span><span>Crane</span><span>Gate</span></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot">Loading&hellip;</div>
  <div class="legend" id="legend"></div>
  <div class="hint">Tap a block to change anything about it. <b>Press and hold</b>
    then drag to move it &mdash; it snaps to 10 minutes. <b>+ Add</b> puts a new one on.
    Everything you do stays on this phone; the real board is never written to.</div>
</main>

<div class="ghost" id="ghost"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Booking"></div>

<script src="../board/config.js"></script>
<script src="../sandbox.js"></script>
<script src="../testkit.js"></script>
<script>
"use strict";
var S = TK.state, hm = TK.hm, esc = TK.esc, two = TK.two;
var COLS = [[], []];

function pxh(){
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pxh")) || 82;
}
function geom(){
  var span = S.close - S.open;
  return {span: span, H: span / 60 * pxh()};
}

function render(){
  var g = document.getElementById("grid");
  var G = geom(), H = G.H, span = G.span, open = S.open;
  var today = S.date === TK.iso(new Date()), nm = TK.nowMin();

  var h = '<div class="times" style="height:' + H + 'px">';
  for(var t = open; t <= S.close; t += 60)
    h += '<b style="top:' + ((t-open)/span*H) + 'px">' + hm(t) + '</b>';
  h += '</div>';

  /* a pour is two rows - the crane allocation and the delivery - so the
     columns split on type, exactly the way the board models it */
  COLS = [S.rows.filter(function(r){ return r.type !== "del"; }),
          S.rows.filter(function(r){ return r.type === "del"; })];

  COLS.forEach(function(set, ci){
    h += '<div class="col" style="height:' + H + 'px">';
    for(var t2 = open; t2 <= S.close; t2 += 30)
      h += '<div class="rule' + (t2 % 60 ? " half" : "") + '" style="top:' +
           ((t2-open)/span*H) + 'px"></div>';
    if(ci === 0) S.breaks.forEach(function(b){
      h += '<div class="brk" style="top:' + ((b[0]-open)/span*H) + 'px;height:' +
           (b[1]/span*H) + 'px"></div>';
    });

    /* overlapping bookings sit side by side, worked out per cluster so one
       clash at 11am does not squeeze the whole day to half width */
    (function(){
      var cluster = [], lanes = [], clEnd = -1;
      function flush(){
        var n = Math.max(1, lanes.length);
        cluster.forEach(function(x){ x.__of = n; });
        cluster = []; lanes = []; clEnd = -1;
      }
      set.forEach(function(r){
        var st = r.start_min, en = st + (r.dur || 10);
        if(clEnd >= 0 && st >= clEnd) flush();
        var li = 0;
        while(lanes[li] !== undefined && lanes[li] > st) li++;
        lanes[li] = en; r.__lane = li; cluster.push(r);
        if(en > clEnd) clEnd = en;
      });
      flush();
    })();

    set.forEach(function(r, i){
      var tr = TK.trade(r.co), c = tr[1], ink = TK.onColour(c);
      var top = (r.start_min - open) / span * H;
      var hh  = Math.max(15, (r.dur || 10) / span * H - 2);
      var wpc = 100 / (r.__of || 1), lpc = (r.__lane || 0) * wpc;
      var qty = r.qty ? r.qty + (r.qty === 1 ? " lift" : " lifts")
                      : (r.kg ? (r.kg/1000).toFixed(1) + "t" : "");
      h += '<button class="ev' + (r.status === "req" ? " req" : "") +
           (hh < 34 ? " one" : "") + (hh < 22 ? " tiny" : "") +
           (r.__added || r.__edited ? " sb" : "") + '" ' +
           'data-k="' + ci + ':' + i + '" style="top:' + top + 'px;height:' + hh +
           'px;left:calc(' + lpc + '% + 2px);width:calc(' + wpc + '% - 4px)' +
           ';background:' + c + ';color:' + ink + ';border-color:' + ink + '">' +
           '<b>' + esc(r.co) + '</b> ' + esc(r.descr || "") +
           (qty ? ' <span class="q">' + esc(qty) + '</span>' : '') + '</button>';
    });
    h += '</div>';
  });

  if(today && nm >= open && nm <= S.close){
    var y = (nm - open) / span * H;
    h += '<div class="nowtag" style="top:' + y + 'px">' + hm(nm) + '</div>' +
         '<div class="nowline" style="top:' + y + 'px"><i></i></div>';
  }
  g.innerHTML = h;

  var hook = COLS[0].reduce(function(a,r){ return a + (r.dur||0); }, 0);
  document.getElementById("foot").innerHTML =
    (S.err ? esc(S.err) : (S.note ? esc(S.note) + "<br>" : "") +
      (S.rows.length
        ? COLS[0].length + " on the hook · " + COLS[1].length + " deliveries · " +
          Math.floor(hook/60) + "h" + two(hook%60) + " hook time"
        : "Nothing booked for this day."));

  var seen = {}, lg = "";
  S.rows.forEach(function(r){
    if(seen[r.co]) return;
    seen[r.co] = 1;
    lg += '<span><i style="background:' + TK.trade(r.co)[1] + '"></i>' +
          esc(TK.trade(r.co)[0]) + '</span>';
  });
  document.getElementById("legend").innerHTML = lg;
}

function rowAt(el){
  var k = el.getAttribute("data-k").split(":");
  return COLS[+k[0]][+k[1]];
}

/* ---------- drag to move ----------
   With a mouse, a drag starts as soon as you move. With a finger it needs a
   press and hold first, otherwise every block on the page would swallow the
   swipe you were using to scroll. */
var drag = null, ghost = document.getElementById("ghost");
var grid = document.getElementById("grid");
var HOLD = 260;

function beginDrag(){
  if(!drag) return;
  drag.live = true;
  drag.el.classList.add("drag");
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}

grid.addEventListener("pointerdown", function(e){
  var el = e.target.closest(".ev");
  if(!el) return;
  var r = rowAt(el);
  if(!r) return;
  drag = {el:el, row:r, y0:e.clientY, t0:Date.now(), live:false, moved:false,
          touch:(e.pointerType === "touch"), start:r.start_min, timer:null};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  if(drag.touch) drag.timer = setTimeout(beginDrag, HOLD);
  else drag.live = false;
});

/* while a drag is live the page must not scroll under it */
grid.addEventListener("touchmove", function(e){
  if(drag && drag.live) e.preventDefault();
}, {passive:false});

grid.addEventListener("pointermove", function(e){
  if(!drag) return;
  var dy = e.clientY - drag.y0;
  if(!drag.live){
    /* moved before the hold finished: on touch that is a scroll, so let go */
    if(Math.abs(dy) > 10){
      if(drag.touch){ clearTimeout(drag.timer); drag = null; return; }
      beginDrag();
    } else return;
  }
  if(!drag.moved && Math.abs(dy) < 4) return;
  drag.moved = true;
  var G = geom(), step = S.per || 10;
  var mv = Math.round(dy * (G.span / G.H) / step) * step;
  var nt = Math.max(S.open, Math.min(S.close - (drag.row.dur || 10), drag.start + mv));
  drag.target = nt;
  drag.el.style.top = ((nt - S.open) / G.span * G.H) + "px";
  ghost.textContent = hm(nt) + " – " + hm(nt + (drag.row.dur || 10));
  ghost.style.left = Math.min(window.innerWidth - 130, Math.max(10, e.clientX - 58)) + "px";
  ghost.style.top  = Math.max(10, e.clientY - 48) + "px";
  ghost.classList.add("on");
  e.preventDefault();
});

function endDrag(){
  if(!drag) return;
  var d = drag; drag = null;
  clearTimeout(d.timer);
  ghost.classList.remove("on");
  d.el.classList.remove("drag");
  if(!d.moved){ TK.openSheet(d.row, false); return; }
  if(d.target != null && d.target !== d.start)
    SB.edit(S.date, d.row, {start_min: d.target});
  TK.refresh();
}
grid.addEventListener("pointerup", endDrag);
grid.addEventListener("pointercancel", endDrag);

function scrollToNow(){
  if(S.date !== TK.iso(new Date())) return;
  var nm = TK.nowMin();
  if(nm < S.open || nm > S.close) return;
  var G = geom();
  window.scrollTo({top: Math.max(0, (nm - S.open)/G.span*G.H - 150)});
}

TK.boot(render);
setTimeout(scrollToNow, 800);
</script>
</body></html>
