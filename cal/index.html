<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../board/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Day view">
<meta name="theme-color" content="#111110">
<meta name="robots" content="noindex,nofollow">
<title>ELISE &middot; Day view</title>
<link rel="stylesheet" href="../board/fonts.css">
<style>
:root{
  --paper:#EFEAE1;--surface:#FBF8F3;--surface-2:#E7E0D3;
  --ink:#2B2926;--ink-2:#6E675D;--ink-3:#938B7E;
  --line:#D9D1C2;--line-hard:#BFB49F;--gold:#8C7B60;
  --ok:#3F6B46;--warn:#9C7220;--crit:#9E3F2B;--clock:#0D6377;--alarm:#C0210F;
  --gut-l:max(14px,env(safe-area-inset-left,0px));
  --gut-r:max(14px,env(safe-area-inset-right,0px));
  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-cond:'Archivo Narrow','Arial Narrow',Arial,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pxh:80px;            /* one hour */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1A1917;--surface:#232220;--surface-2:#2D2B27;
  --ink:#EDE8DE;--ink-2:#A79F92;--ink-3:#817A6E;
  --line:#35322D;--line-hard:#4A463F;--gold:#C3AC82;
  --ok:#8FBF93;--warn:#DDB45F;--crit:#E08A72;--clock:#46BCCE;--alarm:#FF4A3A;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#1A1917;--surface:#232220;--surface-2:#2D2B27;
  --ink:#EDE8DE;--ink-2:#A79F92;--ink-3:#817A6E;
  --line:#35322D;--line-hard:#4A463F;--gold:#C3AC82;
  --ok:#8FBF93;--warn:#DDB45F;--crit:#E08A72;--clock:#46BCCE;--alarm:#FF4A3A;
  color-scheme:dark;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);
  font-size:14px;line-height:1.4;overscroll-behavior-y:none}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

header{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line-hard);
  padding:9px var(--gut-r) 0 var(--gut-l)}
.top{display:flex;align-items:center;gap:9px}
.wm{font-family:var(--f-cond);font-size:14px;font-weight:700;letter-spacing:.3em;
  text-transform:uppercase}
.clk{font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--clock)}
.back{margin-left:auto;font-family:var(--f-cond);font-size:11px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);text-decoration:none;
  border:1px solid var(--line);border-radius:4px;padding:5px 9px}
.back:active{background:var(--surface-2)}
.datebar{display:flex;align-items:center;gap:8px;padding:8px 0 9px}
.datebar button{font:inherit;font-family:var(--f-cond);font-size:16px;font-weight:600;
  background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);
  width:34px;height:30px;cursor:pointer;line-height:1}
.datebar button:active{background:var(--surface-2)}
.dlab{font-family:var(--f-cond);font-size:14px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;flex:1;text-align:center}
.dlab small{display:block;font-family:var(--f-num);font-size:10px;font-weight:400;
  letter-spacing:0;color:var(--ink-3);text-transform:none}
.hdrow{display:grid;grid-template-columns:42px 1fr 1fr;border-top:1px solid var(--line)}
.hdrow span{font-family:var(--f-cond);font-size:10px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);padding:6px 0 6px 7px;
  border-left:1px solid var(--line)}
.hdrow span:first-child{border-left:0}

main{padding:9px var(--gut-r) 28px var(--gut-l)}
.grid{display:grid;grid-template-columns:42px 1fr 1fr;position:relative}
.times{position:relative}
.times b{position:absolute;right:7px;font-family:var(--f-num);font-size:10px;font-weight:400;
  color:var(--ink-3);transform:translateY(-5px)}
.col{position:relative;border-left:1px solid var(--line)}
.rule{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.rule.half{opacity:.45;border-top-style:dotted}
.brk{position:absolute;left:0;right:0;
  background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.ev{position:absolute;left:2px;right:2px;border-radius:4px;padding:3px 6px;overflow:hidden;
  font-size:11.5px;line-height:1.22;cursor:pointer;border:1px solid transparent;
  display:block;width:calc(100% - 4px);text-align:left;font-family:inherit}
.ev b{font-family:var(--f-cond);font-weight:700;letter-spacing:.06em}
.ev.one{white-space:nowrap;text-overflow:ellipsis}
/* a 10-minute booking is 15px tall - shrink the type rather than slice it */
.ev.tiny{padding:0 5px;font-size:9.5px;line-height:15px}
.ev .q{font-family:var(--f-num);font-size:9.5px;opacity:.8}
.ev.req{border-style:dashed}
.ev:active{filter:brightness(1.12)}
.nowline{position:absolute;left:42px;right:0;border-top:2px solid var(--alarm);z-index:6;
  pointer-events:none}
.nowline i{position:absolute;left:-5px;top:-5px;width:9px;height:9px;border-radius:50%;
  background:var(--alarm)}
.nowtag{position:absolute;left:0;width:42px;text-align:right;padding-right:7px;
  font-family:var(--f-num);font-size:9.5px;color:var(--alarm);transform:translateY(-6px);
  z-index:6;pointer-events:none;background:var(--paper)}

.state{padding:14px 0;font-size:12.5px;color:var(--ink-3);font-family:var(--f-num)}
.legend{display:flex;gap:11px;flex-wrap:wrap;padding:11px 0 0;font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--line);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;
  vertical-align:baseline}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-top:1px solid var(--line-hard);border-radius:14px 14px 0 0;
  padding:14px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);
  max-height:76vh;overflow-y:auto;transform:translateY(102%);
  transition:transform .18s ease-out}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding-bottom:9px}
.sheet .sh .pill{font-family:var(--f-cond);font-size:11px;font-weight:700;letter-spacing:.1em;
  border-radius:3px;padding:3px 7px}
.sheet .sh .tm{font-family:var(--f-num);font-size:15px;font-weight:600;margin-left:auto}
.sheet h2{margin:0 0 9px;font-size:16px;font-weight:600;line-height:1.3}
.sheet dl{margin:0;display:grid;grid-template-columns:84px 1fr;gap:5px 10px;font-size:12.5px}
.sheet dt{font-family:var(--f-cond);font-size:10.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.sheet dd{margin:0}
.sheet .notes{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.5;color:var(--ink-2);white-space:pre-wrap}
.sheet .close{display:block;width:100%;margin-top:14px;font:inherit;font-family:var(--f-cond);
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line-hard);border-radius:5px;color:var(--ink-2);
  padding:10px;cursor:pointer}
.ro{font-family:var(--f-cond);font-size:9.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;
  padding:2px 6px}
</style>
</head>
<body>

<header>
  <div class="top">
    <span class="wm">Elise</span>
    <span class="clk" id="clk">--:--</span>
    <span class="ro">Test &middot; read only</span>
    <a class="back" href="../board/">Board</a>
  </div>
  <div class="datebar">
    <button type="button" id="prev" aria-label="Previous day">&lsaquo;</button>
    <span class="dlab" id="dlab">&nbsp;<small>&nbsp;</small></span>
    <button type="button" id="next" aria-label="Next day">&rsaquo;</button>
  </div>
  <div class="hdrow"><span></span><span>Crane</span><span>Gate</span></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="state" id="state">Loading&hellip;</div>
  <div class="legend" id="legend"></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Movement detail"></div>

<script src="../board/config.js"></script>
<script>
"use strict";
/* ==========================================================================
   ELISE - DAY VIEW (test page)
   A calendar day view over the same lifts table the board reads. Read only:
   no writes anywhere in this file, so it cannot damage a booking.
   ========================================================================== */
var CFG  = window.ELISE_CONFIG || {};
var REST = (CFG.url || "").replace(/\/+$/, "") + "/rest/v1/";
var KEY  = CFG.key || "";
var PROJ = "ELISE";

function api(path){
  return fetch(REST + path, {headers:{apikey:KEY, Authorization:"Bearer " + KEY}})
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function two(n){ return (n < 10 ? "0" : "") + n; }
function hm(m){ return two(Math.floor(m/60)) + ":" + two(((m%60)+60)%60); }
function iso(d){ return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate()); }
function nowMin(){ var n = new Date(); return n.getHours()*60 + n.getMinutes(); }

/* the board opens on today until 4:30pm, then on tomorrow - match it */
var ROLLOVER = 990;
function boardDate(){
  var n = new Date();
  if(n.getHours()*60 + n.getMinutes() >= ROLLOVER) n.setDate(n.getDate() + 1);
  return iso(n);
}
function dayName(s){
  var p = s.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  var W = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return W[d.getDay()] + " " + d.getDate() + " " + M[d.getMonth()];
}
function shift(s, n){
  var p = s.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return iso(d);
}

/* ---------- state ---------- */
var DEF_TRADES = [["EC","Elise","#A8A05C"],["GLF","G+L Form","#FF8A00"],
  ["ECC","East Coast Concrete","#5A6670"],["EEC","Encon PT","#D92B20"],
  ["AP","Advanced Precast","#00C875"],["NEU","Neumann Steel","#1E4FA3"],
  ["NS","Newnham Scaffolding","#FFCB00"],["RZE","Rize Reinforcements","#FF2D87"],
  ["BUT","Butlers","#784BD1"],["S4U","Skips 4 U","#8B1E3F"],["OTH","Other","#B9B2A6"]];
var LKIND = {LOAD:"Load in",BAYS:"Loading bays",SPIN:"Spin up",SNGL:"Single height",
  DECK:"Deck lift",BACK:"Backload",BOOM:"Boom pump",KIB:"Kibble / pour",FLY:"Formwork fly",
  SET:"Set up / dismantle",BIN:"Bins out",PLANT:"Plant / gear",HAND:"Hand unload",
  FORK:"Forklift off",CRANE:"Crane off",CONC:"Concrete truck",PUMP:"Pump",
  SEMI:"Semi / float",HIAB:"Hiab / self-loader",MOVE:"Move"};

var state = {
  date: (location.hash || "").replace(/^#/, "") || boardDate(),
  open: 360, close: 1080, breaks: [[600,30],[780,30]],
  trades: {}, rows: [], err: ""
};
DEF_TRADES.forEach(function(t){ state.trades[t[0]] = [t[1], t[2]]; });

function trade(code){ return state.trades[code] || [code || "Other", "#B9B2A6"]; }

/* text that survives on its own trade colour */
function onColour(hex){
  var h = String(hex || "").replace("#","");
  if(h.length !== 6) return "#FFFFFF";
  function li(v){ v = parseInt(v,16)/255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }
  var L = .2126*li(h.slice(0,2)) + .7152*li(h.slice(2,4)) + .0722*li(h.slice(4,6));
  return L > .42 ? "#1A1917" : "#FFFFFF";
}

/* ---------- loading ---------- */
function loadConfig(){
  return api("config?select=data&id=eq.board&project=eq." + PROJ).then(function(rows){
    var d = rows[0] && rows[0].data;
    if(!d) return;
    if(typeof d.open  === "number") state.open  = d.open;
    if(typeof d.close === "number") state.close = d.close;
    if(Array.isArray(d.breaks)) state.breaks = d.breaks;
    if(Array.isArray(d.trades)){
      state.trades = {};
      d.trades.forEach(function(t){ state.trades[t[0]] = [t[1], t[2]]; });
    }
  }).catch(function(){ /* defaults are fine */ });
}
function loadDay(){
  return api("lifts?select=*&project=eq." + PROJ + "&date=eq." + state.date +
             "&order=start_min.asc").then(function(rows){
    state.rows = rows || [];
    state.err = "";
  }).catch(function(e){
    state.err = "Could not reach the board data (" + e.message + "). Pull down to retry.";
  });
}

/* ---------- drawing ---------- */
function pxh(){
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pxh")) || 80;
}
function render(){
  var g = document.getElementById("grid");
  var open = state.open, close = state.close, span = close - open;
  var H = span / 60 * pxh();
  var today = state.date === iso(new Date());
  var nm = nowMin();

  var h = '<div class="times" style="height:' + H + 'px">';
  for(var t = open; t <= close; t += 60)
    h += '<b style="top:' + ((t-open)/span*H) + 'px">' + hm(t) + '</b>';
  h += '</div>';

  /* a pour is two rows - the crane allocation and the delivery - so the
     columns split on type, exactly as the board models it */
  var cols = [
    state.rows.filter(function(r){ return r.type !== "del"; }),
    state.rows.filter(function(r){ return r.type === "del"; })
  ];

  cols.forEach(function(set, ci){
    h += '<div class="col" style="height:' + H + 'px">';
    for(var t2 = open; t2 <= close; t2 += 30)
      h += '<div class="rule' + (t2 % 60 ? " half" : "") + '" style="top:' +
           ((t2-open)/span*H) + 'px"></div>';
    if(ci === 0) state.breaks.forEach(function(b){
      h += '<div class="brk" style="top:' + ((b[0]-open)/span*H) + 'px;height:' +
           (b[1]/span*H) + 'px"></div>';
    });
    /* Lay overlapping bookings side by side, the way a calendar does.
       Width is worked out per cluster of things that actually overlap, so one
       clash at 11am does not squeeze the whole day to half width. */
    (function(){
      var cluster = [], lanes = [], clEnd = -1;
      function flush(){
        var n = Math.max(1, lanes.length);
        cluster.forEach(function(x){ x.__of = n; });
        cluster = []; lanes = []; clEnd = -1;
      }
      set.forEach(function(r){
        var st = r.start_min, en = st + (r.dur || 10);
        if(clEnd >= 0 && st >= clEnd) flush();
        var li = 0;
        while(lanes[li] !== undefined && lanes[li] > st) li++;
        lanes[li] = en;
        r.__lane = li;
        cluster.push(r);
        if(en > clEnd) clEnd = en;
      });
      flush();
    })();
    set.forEach(function(r, i){
      var tr = trade(r.co), c = tr[1], ink = onColour(c);
      var top = (r.start_min - open) / span * H;
      var hh  = Math.max(15, (r.dur || 10) / span * H - 2);
      var wpc = 100 / (r.__of || 1);
      var lpc = r.__lane * wpc;
      var qty = r.qty ? r.qty + (r.qty === 1 ? " lift" : " lifts")
                      : (r.kg ? (r.kg/1000).toFixed(1) + "t" : "");
      h += '<button class="ev' + (r.status === "req" ? " req" : "") +
           (hh < 34 ? " one" : "") + (hh < 22 ? " tiny" : "") + '" ' +
           'data-k="' + ci + ':' + i + '" style="top:' + top + 'px;height:' + hh +
           'px;left:calc(' + lpc + '% + 2px);width:calc(' + wpc + '% - 4px);right:auto' +
           ';background:' + c + ';color:' + ink + ';border-color:' + ink + '">' +
           '<b>' + esc(r.co) + '</b> ' + esc(r.descr || "") +
           (qty ? ' <span class="q">' + esc(qty) + '</span>' : '') + '</button>';
    });
    h += '</div>';
  });

  if(today && nm >= open && nm <= close){
    var y = (nm - open) / span * H;
    h += '<div class="nowtag" style="top:' + y + 'px">' + hm(nm) + '</div>' +
         '<div class="nowline" style="top:' + y + 'px"><i></i></div>';
  }
  g.innerHTML = h;
  g.dataset.cols = "";
  g._cols = cols;

  document.getElementById("dlab").innerHTML =
    esc(dayName(state.date)) + "<small>" + esc(state.date) + "</small>";

  var lifts = state.rows.filter(function(r){ return r.type !== "del"; }).length;
  var dels  = state.rows.length - lifts;
  var hook  = state.rows.filter(function(r){ return r.type !== "del"; })
                .reduce(function(a,r){ return a + (r.dur || 0); }, 0);
  document.getElementById("state").textContent = state.err ? state.err :
    (state.rows.length
      ? lifts + " on the hook · " + dels + " deliveries · " +
        Math.floor(hook/60) + "h" + two(hook%60) + " hook time"
      : "Nothing booked for this day.");

  var seen = {}, lg = "";
  state.rows.forEach(function(r){
    if(seen[r.co]) return;
    seen[r.co] = 1;
    var tr = trade(r.co);
    lg += '<span><i style="background:' + tr[1] + '"></i>' + esc(tr[0]) + '</span>';
  });
  document.getElementById("legend").innerHTML = lg;
}

/* ---------- detail sheet ---------- */
function openSheet(r){
  var tr = trade(r.co), c = tr[1];
  var rows = [
    ["Mob", esc(tr[0]) + (r.co2 ? " + " + esc(trade(r.co2)[0]) : "")],
    ["Window", hm(r.start_min) + " – " + hm(r.start_min + (r.dur||0)) +
               "  (" + (r.dur||0) + " min)"],
    ["Kind", esc(LKIND[r.kind] || r.kind || "—")],
    ["Route", esc((r.from_loc || "?") + " → " + (r.to_loc || "?"))],
    ["Crane", r.crane && r.crane !== "none" ? esc(r.crane) : "no crane"],
    ["Quantity", (r.qty ? r.qty + " lifts" : "—") + (r.kg ? " · " + r.kg.toLocaleString() + " kg" : "")],
    ["Status", r.status === "con" ? "Confirmed" : "Requested — not confirmed"],
    ["Booked by", esc(r.booked_by || "—")]
  ];
  if(r.pair) rows.push(["Paired with", esc(r.pair)]);
  var s = document.getElementById("sheet");
  s.innerHTML =
    '<div class="sh"><span class="pill" style="background:' + c + ';color:' + onColour(c) +
      '">' + esc(r.co) + '</span>' +
      '<span class="ro">' + (r.type === "del" ? "Delivery" : "Crane") + '</span>' +
      '<span class="tm">' + hm(r.start_min) + '</span></div>' +
    '<h2>' + esc(r.descr || "") + '</h2><dl>' +
    rows.map(function(x){ return '<dt>' + x[0] + '</dt><dd>' + x[1] + '</dd>'; }).join("") +
    '</dl>' +
    (r.notes ? '<div class="notes">' + esc(r.notes) + '</div>' : '') +
    '<button class="close" type="button" id="sclose">Close</button>';
  document.getElementById("scrim").classList.add("on");
  s.classList.add("on");
  document.getElementById("sclose").addEventListener("click", closeSheet);
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeSheet(); });

document.getElementById("grid").addEventListener("click", function(e){
  var b = e.target.closest(".ev");
  if(!b) return;
  var k = b.getAttribute("data-k").split(":");
  var r = this._cols[+k[0]][+k[1]];
  if(r) openSheet(r);
});

/* ---------- clock, nav, refresh ---------- */
function tick(){
  var n = new Date();
  document.getElementById("clk").textContent = two(n.getHours()) + ":" + two(n.getMinutes());
}
function go(d){
  state.date = d;
  if(location.hash.replace(/^#/,"") !== d) location.hash = d;
  loadDay().then(render);
}
document.getElementById("prev").addEventListener("click", function(){ go(shift(state.date,-1)); });
document.getElementById("next").addEventListener("click", function(){ go(shift(state.date, 1)); });
window.addEventListener("hashchange", function(){
  var d = (location.hash || "").replace(/^#/,"");
  if(d && d !== state.date) go(d);
});

function scrollToNow(){
  if(state.date !== iso(new Date())) return;
  var nm = nowMin();
  if(nm < state.open || nm > state.close) return;
  var y = (nm - state.open) / (state.close - state.open) * ((state.close-state.open)/60*pxh());
  window.scrollTo({top: Math.max(0, y - 150), behavior: "instant"});
}

tick();
setInterval(tick, 20000);
loadConfig().then(loadDay).then(function(){ render(); scrollToNow(); });
setInterval(function(){ loadDay().then(render); }, 60000);
